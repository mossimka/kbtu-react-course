<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div>
          <p class="kicker">KBTU / React practise</p>
          <h1>JavaScript<br /><em>lab notes.</em></h1>
          <p class="intro">A live index of the small experiments behind the course tasks.</p>
        </div>
        <div class="hero-meta">
          <span class="pulse"></span>
          <span id="run-status">Ready to run</span>
          <button id="rerun" type="button">Run all <span aria-hidden="true">↗</span></button>
        </div>
      </header>

      <section class="summary" aria-label="Run summary">
        <div><strong id="task-count">12</strong><span>routines</span></div>
        <div><strong>ESM</strong><span>native modules</span></div>
        <div><strong id="output-count">0</strong><span>outputs captured</span></div>
      </section>

      <section id="task-grid" class="task-grid" aria-live="polite"></section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
