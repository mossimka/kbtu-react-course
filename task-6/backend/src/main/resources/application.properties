spring.application.name=mission-api

server.port=${PORT:8080}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
app.cors.always-allowed-origin-patterns=${CORS_ALWAYS_ALLOWED_ORIGIN_PATTERNS:https://mossimka.github.io}

app.auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:168}

# Add missing tables/columns for the current entities without touching existing
# mission data. Can be overridden from the deployment environment.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

