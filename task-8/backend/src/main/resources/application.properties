spring.application.name=mission-api

server.port=${PORT:8080}

app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173}
# Deployment origins that are always allowed in addition to the environment
# list above. Render's CORS_ALLOWED_ORIGIN_PATTERNS is managed in the dashboard,
# so the GitHub Pages origin is configured separately and merged in code.
app.cors.always-allowed-origin-patterns=${CORS_ALWAYS_ALLOWED_ORIGIN_PATTERNS:https://mossimka.github.io}

app.auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:168}

# Firebase project that issues the browser ID tokens. The value is public and
# must match VITE_FIREBASE_PROJECT_ID in the frontend build. Set it to an empty
# string to disable Firebase token verification.
app.firebase.project-id=${FIREBASE_PROJECT_ID:react-auth-352c2}

# Keep the deployed schema in step with the JPA entities. The managed Postgres
# instance already holds the mission data, so "update" adds missing tables
# (for example app_users and auth_tokens) without dropping existing rows.
# Explicit migrations remain the long-term option.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

